<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultar Radicados - Ventanilla Única</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="public/img/archivo.png" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex flex-col justify-between">
    <!-- HEADER -->
    <header
      class="bg-blue-900 text-white shadow-md p-4 text-center font-bold text-lg"
    >
      Alcaldía Municipal - Consulta de Radicados
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-6xl w-full mx-auto p-6 flex-grow">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800">
          Listado de Documentos Recibidos
        </h1>
        <a
          href="index.html"
          class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm transition"
        >
          ← Registrar Nuevo Radicado
        </a>
      </div>

      <!-- Buscador -->
      <div class="mb-6">
        <input
          type="text"
          id="buscador"
          placeholder="Buscar por número de radicado, cédula o remitente..."
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm"
        />
      </div>

      <!-- Tabla de Resultados -->
      <div
        class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden"
      >
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-slate-50 text-slate-700 text-xs uppercase font-semibold border-b border-slate-200"
              >
                <th class="p-4">Radicado</th>
                <th class="p-4">Fecha</th>
                <th class="p-4">Remitente</th>
                <th class="p-4">Cédula / NIT</th>
                <th class="p-4">Destino</th>
                <th class="p-4">Tiempo de Respuesta</th>
                <th class="p-4">Soporte</th>
              </tr>
            </thead>
            <tbody
              id="tabla-radicados"
              class="divide-y divide-slate-100 text-sm text-slate-700"
            >
              <!-- Los datos se inyectarán dinámicamente con JavaScript -->
              <tr>
                <td colspan="6" class="p-6 text-center text-slate-400">
                  Cargando radicados...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t py-4 text-center text-xs text-slate-500">
      Sistema de Ventanilla Única - Prácticas ADSO | Alcaldía Municipal
    </footer>

    <script src="js/consultar.js"></script>
  </body>
</html>
